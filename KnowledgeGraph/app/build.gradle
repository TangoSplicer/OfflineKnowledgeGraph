// android/app/build.gradle (App-level)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.knowledgegraph.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.knowledgegraph.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        buildConfigField "String", "ENGINE_VERSION", "\"1.0.0\""
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.1"
    }

    externalNativeBuild {
        cmake {
            path "src/main/CMakeLists.txt"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    task("compileLisp", type: Exec) {
        workingDir "src/main/lisp"
        commandLine "sbcl", "--script", "compile.lisp"
    }
    preBuild.dependsOn compileLisp

    task("compileMercury", type: Exec) {
        workingDir "src/main/mercury"
        commandLine "mmc", "--make"
    }
    preBuild.dependsOn compileMercury
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.compose.ui:ui:1.6.7"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'
    implementation 'com.google.mlkit:natural-language:22.0.1'
}