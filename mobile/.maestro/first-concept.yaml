appId: com.app.offlineknowledgegraphmobile
---
# Starts from an empty local workspace and completes the first-concept wizard through a visible template.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Start with one idea."
    timeout: 90000
- tapOn: "Create your first concept"
- assertVisible: "What idea do you want to keep close?"
- tapOn: "Reading note"
- tapOn: "Continue to the note"
- assertVisible: "Why does A useful idea from my reading matter?"
- tapOn: "Create this concept"
- assertVisible: "Give A useful idea from my reading a useful neighbor."
- tapOn: "Later"
- assertVisible: "A useful idea from my reading"
