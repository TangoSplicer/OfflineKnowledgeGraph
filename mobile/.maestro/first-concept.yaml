appId: com.app.offlineknowledgegraphmobile
---
# Starts from an empty local workspace and validates a visible first-concept template selection.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Start with one idea."
    timeout: 90000
- tapOn:
    id: "home-create-first-concept"
- extendedWaitUntil:
    visible: "What idea do you want to keep close?"
    timeout: 30000
- pressKey: back
- tapOn:
    id: "first-concept-template-reading-note"
- assertVisible: "Reading note applied — customize every field below."
