appId: com.app.offlineknowledgegraphmobile
---
# Verifies that the Library tab remains reachable from a fresh, local-only workspace.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Start with one idea."
    timeout: 90000
- tapOn: "Library"
- assertVisible: "Your thinking, in one place."
- assertVisible: "Create idea"
- assertVisible: "Load example"
