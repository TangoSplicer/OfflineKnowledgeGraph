appId: com.app.offlineknowledgegraphmobile
---
# Loads the optional local demo only for the interaction test, then exercises Explore filtering.
- launchApp:
    clearState: true
- assertVisible: "Start with one idea."
- tapOn: "Load demo graph"
- assertVisible: "Make sense of what you know."
- tapOn: "Explore →"
- assertVisible: "Explore connections"
- assertVisible: "Find a path through your graph"
- tapOn: "Strong"
- assertVisible: "Clear search and filters"
