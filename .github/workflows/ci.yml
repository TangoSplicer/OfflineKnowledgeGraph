name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: offline-knowledge-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Rust core and validate FFI bridge
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test Rust core
        working-directory: rust-core
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Fetch Common Lisp FFI dependencies
        working-directory: common-lisp-ffi
        run: |
          git clone --depth 1 https://github.com/trivial-features/trivial-features.git
          git clone --depth 1 https://github.com/kmx-io/alexandria.git
          git clone --depth 1 https://github.com/cl-babel/babel.git
          git clone --depth 1 https://github.com/cffi/cffi.git

      - name: Validate Common Lisp to Rust FFI bridge
        working-directory: common-lisp-ffi
        run: sbcl --non-interactive --load load_local_cffi.lisp

  build-android-apk:
    name: Validate mobile app and build Android release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Lint mobile source
        working-directory: mobile
        run: pnpm lint

      - name: Validate Expo configuration
        working-directory: mobile
        run: npx expo config --type public

      - name: Validate mobile TypeScript and tests
        working-directory: mobile
        run: |
          pnpm check
          pnpm test -- --run

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble release APK with bundled JavaScript
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android release APK
        uses: actions/upload-artifact@v6
        with:
          name: offline-knowledge-graph-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  android-interaction-tests:
    name: Run Android Maestro interaction flows
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Android release APK
        uses: actions/download-artifact@v5
        with:
          name: offline-knowledge-graph-release-apk
          path: mobile/android/app/build/outputs/apk/release

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=1.39.0
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run deterministic Android interaction flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          ram-size: 2048M
          target: default
          script: |
            mkdir -p mobile/maestro-artifacts
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            set +e
            maestro test --debug-output mobile/maestro-artifacts --format=junit --output=mobile/maestro-artifacts/report.xml --no-ansi mobile/.maestro
            maestro_exit_code=$?
            adb logcat -d > mobile/maestro-artifacts/android-logcat.txt || true
            exit $maestro_exit_code

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-android-interaction-evidence
          path: |
            mobile/maestro-artifacts
            mobile/.maestro/screenshots
          if-no-files-found: warn
