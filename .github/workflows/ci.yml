name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Rust core and validate FFI bridge
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test Rust core
        working-directory: rust-core
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Fetch Common Lisp FFI dependencies
        working-directory: common-lisp-ffi
        run: |
          git clone --depth 1 https://github.com/trivial-features/trivial-features.git
          git clone --depth 1 https://github.com/kmx-io/alexandria.git
          git clone --depth 1 https://github.com/cl-babel/babel.git
          git clone --depth 1 https://github.com/cffi/cffi.git

      - name: Validate Common Lisp to Rust FFI bridge
        working-directory: common-lisp-ffi
        run: sbcl --non-interactive --load load_local_cffi.lisp

  build-android-apk:
    name: Validate mobile app and build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Validate mobile TypeScript and tests
        working-directory: mobile
        run: |
          pnpm check
          pnpm test

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: offline-knowledge-graph-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
