name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-action@stable
      with:
        toolchain: stable

    - name: Build Rust Core
      run: |
        cd rust-core
        cargo build --release

    - name: Set up SBCL and Run Common Lisp FFI Test
      run: |
        sudo apt-get update && sudo apt-get install -y sbcl
        cd common-lisp-ffi
        git clone https://github.com/trivial-features/trivial-features.git
        git clone https://github.com/kmx-io/alexandria.git
        git clone https://github.com/cl-babel/babel.git
        git clone https://github.com/cffi/cffi.git
        sbcl --non-interactive --load load_local_cffi.lisp
